
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: naveenchowdary577/adaptive-mas:1.0.0
    container_name: adaptive_mas_app
    env_file:
      - .env
    # Required for the interactive CLI prompts (equivalent to -it)
    stdin_open: true
    tty: true
    # Persist benchmark and execution logs generated by the system
    volumes:
      - ./runs:/app/runs
  
