services:
  # Web API server service (for Astrix integration, Render, and headless use)
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${TAG:-latest}
    image: naveenchowdary577/adaptive-mas:${TAG:-latest}
    container_name: adaptive_mas_server
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs

  # Local interactive CLI service (for debugging with terminal input)
  cli:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${TAG:-latest}
    image: naveenchowdary577/adaptive-mas:${TAG:-latest}
    container_name: adaptive_mas_cli
    command: ["python", "app/main.py"]
    env_file:
      - .env
    stdin_open: true
    tty: true
    volumes:
      - ./runs:/app/runs
