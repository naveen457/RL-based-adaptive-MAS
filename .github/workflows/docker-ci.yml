name: Docker CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Explicit Docker image tag override (optional - defaults to version in Dockerfile)'
        required: false
        default: ''

env:
  IMAGE_NAME: naveenchowdary577/adaptive-mas

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract version from Dockerfile
        id: extract_version
        run: |
          OVERRIDE="${{ github.event.inputs.tag }}"
          if [ -n "$OVERRIDE" ]; then
            VERSION="$OVERRIDE"
          else
            VERSION=$(grep -E '^\s*LABEL\s+version=' Dockerfile | head -n1 | sed -E 's/.*version="?([^"]*)"?.*/\1/' | tr -d '\r\n ')
            if [ -z "$VERSION" ] || [ "$VERSION" = '${VERSION}' ]; then
              VERSION=$(grep -E '^\s*ARG\s+VERSION=' Dockerfile | head -n1 | cut -d'=' -f2 | tr -d '\r\n "')
            fi
          fi
          if [ -z "$VERSION" ]; then
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Determined image version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.extract_version.outputs.version }},enable=${{ steps.extract_version.outputs.version != '' && steps.extract_version.outputs.version != 'latest' }}
            type=ref,event=tag

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.extract_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
